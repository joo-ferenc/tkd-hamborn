<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)} body{margin:0} img{max-width:100%} [hidden]{display:none!important}</style>
<title>TKD Hamborn</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Barlow:wght@400;600;700&family=Noto+Sans+KR:wght@500;700&display=swap">
<style>
/* Vereinsstil TKD Duisburg-Hamborn: dunkler Kopf, rote Akzente, helle Inhaltsfläche – bewusst eine feste Optik */
:root {
  --dunkel: #141416; --dunkel2: #2E2E33; --rot: #D7192A; --rot-hell: #FBE6E8;
  --grund: #F2F2F3; --karte: #FFFFFF; --ink: #141416; --ink2: #3D3D42; --grau: #5C5C62;
  --hellgrau: #C9C9CE; --rand: #5A5A60; --blau: #0047A0; --chung: #1F5FD1;
  --gruen: #2E7D32; --falsch: #C62828; --hinweis: #E8E8EC; --gold: #FFD54A;
  --titel: "Oswald", "Arial Narrow", "Roboto Condensed", sans-serif;
  --text: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  --kr: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  color-scheme: light;
}
html, body { height: 100%; }
body { background: #0B0B0C; color: var(--ink); font-family: var(--text); font-size: 15px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--dunkel); }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0; }
button:focus-visible, a:focus-visible, [tabindex]:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
a { color: inherit; }

#app { max-width: 480px; margin: 0 auto; min-height: 100%; background: var(--grund); display: flex; flex-direction: column; position: relative; }
.seite { display: flex; flex-direction: column; min-height: 100%; flex: 1; }
.voll { height: 100%; min-height: 0; }

/* Kopf */
.kopf { background: var(--dunkel); color: #fff; padding-block: 16px; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; }
.kopf .zeile { display: flex; align-items: center; gap: 12px; }
.rund-btn { width: 44px; height: 44px; flex: none; border: 2px solid var(--rand); border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 18px; }
.rund-btn:hover { border-color: #8A8A90; }
.h-titel { font-family: var(--titel); font-weight: 700; text-transform: uppercase; letter-spacing: .04em; font-size: 20px; line-height: 1.1; flex: 1; min-width: 0; text-wrap: balance; }
.strich { width: 64px; height: 4px; background: var(--rot); margin-top: 12px; }
.unter { color: var(--hellgrau); font-size: 14px; margin-top: 10px; }

.inhalt { padding-block: 14px 20px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 10px; flex: 1; }
.unten { padding-block: 10px 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); position: sticky; bottom: 0; background: linear-gradient(to top, var(--grund) 75%, transparent); padding-bottom: max(16px, env(safe-area-inset-bottom, 0px)); }

.karte { background: var(--karte); border-radius: 12px; padding: 14px 16px; box-shadow: 0 1px 2px rgba(20,20,22,.10); display: flex; flex-direction: column; gap: 4px; }
.karte.grau { background: var(--hinweis); box-shadow: none; }
.karte.rosa { background: var(--rot-hell); box-shadow: none; }
.label { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--grau); }
.label.rot { color: var(--rot); }
.t-gross { font-family: var(--titel); font-weight: 700; font-size: 20px; line-height: 1.2; }
.t-text { font-size: 16px; line-height: 1.45; white-space: pre-line; }
.klein { font-size: 13px; color: var(--grau); line-height: 1.4; }
.mini { font-size: 12px; color: var(--grau); line-height: 1.45; }
.aus { color: var(--blau); font-weight: 700; }
.hangul { font-family: var(--kr); color: var(--grau); font-weight: 500; }

.haupt-btn { width: 100%; min-height: 56px; border-radius: 12px; background: var(--rot); color: #fff; font-family: var(--titel); font-weight: 700; font-size: 18px; letter-spacing: .06em; text-transform: uppercase; }
.haupt-btn.dunkel { background: var(--dunkel); }
.haupt-btn:active { filter: brightness(.92); }
.text-link { color: var(--rot); font-weight: 700; font-size: 15px; padding: 12px 0; text-align: left; }

.laut { width: 44px; height: 44px; flex: none; border-radius: 50%; background: var(--dunkel); display: grid; place-items: center; }
.laut svg { width: 22px; height: 22px; }
.laut.gross { width: 60px; height: 60px; }
.laut.gross svg { width: 28px; height: 28px; }
.laut.rot { background: var(--rot); }

.eintrag { display: flex; align-items: center; gap: 10px; background: var(--karte); border-radius: 12px; padding: 10px 12px 10px 14px; box-shadow: 0 1px 2px rgba(20,20,22,.10); text-align: left; width: 100%; }
.eintrag .txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.eintrag .ko { font-family: var(--titel); font-weight: 700; font-size: 18px; }
.eintrag .ko .hangul { font-family: var(--kr); font-size: 14px; margin-left: 8px; }
.eintrag .de { font-size: 14px; color: var(--ink2); }
.pfeil { font-size: 24px; font-weight: 700; color: var(--grau); }

.gurt { display: inline-flex; align-items: center; flex: none; border-radius: 3px; box-shadow: inset 0 0 0 1px rgba(0,0,0,.25); }
.gurt i { display: block; width: 100%; }
.auf-dunkel .gurt { box-shadow: inset 0 0 0 1px rgba(255,255,255,.5); }

/* Startseite */
.start-kopf { background: var(--dunkel); color: #fff; padding-block: 18px 20px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; align-items: center; gap: 12px; }
.logos { display: flex; align-items: center; gap: 10px; width: 100%; }
.logos img { width: 72px; height: 72px; flex: none; }
.logos .name { flex: 1; text-align: center; min-width: 0; }
.vname { font-family: var(--titel); font-weight: 700; font-size: 19px; text-transform: uppercase; letter-spacing: .04em; line-height: 1.15; }
.spruch { font-family: var(--titel); font-weight: 700; font-size: 24px; text-transform: uppercase; letter-spacing: .05em; text-align: center; text-wrap: balance; }
.chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
.chips span { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 5px 8px; border: 1px solid #4A4A50; border-radius: 4px; }
.karte.ziel { flex-direction: row; align-items: center; gap: 14px; text-align: left; width: 100%; }
.ziel .farbe { width: 6px; align-self: stretch; border-radius: 3px; min-height: 52px; }
.kacheln { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.kachel { border-radius: 12px; padding: 16px; min-height: 104px; display: flex; flex-direction: column; gap: 4px; text-align: left; background: var(--karte); box-shadow: 0 1px 2px rgba(20,20,22,.10); }
.kachel .marke { width: 26px; height: 4px; background: var(--rot); margin-bottom: 10px; }
.kachel .k-titel { font-family: var(--titel); font-weight: 700; font-size: 18px; text-transform: uppercase; letter-spacing: .04em; }
.kachel .k-unter { font-size: 13px; color: var(--grau); }
.kachel.dunkel { background: var(--dunkel); color: #fff; box-shadow: none; }
.kachel.dunkel .k-unter { color: var(--hellgrau); }
.kachel.rot { background: var(--rot); color: #fff; box-shadow: none; }
.kachel.rot .marke { background: #fff; }
.kachel.rot .k-unter { color: #FFE3E5; }
.kampf-kachel { display: flex; align-items: center; gap: 14px; background: var(--dunkel); color: #fff; border-radius: 12px; padding: 14px 16px; text-align: left; width: 100%; }
.kampf-kachel .marke { width: 6px; height: 44px; background: var(--rot); flex: none; }
.fuss { text-align: center; }

/* Gürtel-Liste */
.gurt-zeile { display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 8px 12px; border-radius: 10px; background: var(--karte); box-shadow: 0 1px 2px rgba(20,20,22,.10); text-align: left; width: 100%; }
.gurt-zeile.ziel-an { background: var(--dunkel); color: #fff; box-shadow: none; }
.gurt-zeile.ziel-an .klein { color: var(--hellgrau); }
.gurt-zeile.ziel-an .pfeil { color: #fff; }
.tag { font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 4px; background: var(--rot); color: #fff; flex: none; }

/* Reiter */
.reiter { display: flex; gap: 2px; overflow-x: auto; margin: 10px -20px -16px; padding: 0 8px; scrollbar-width: none; }
.reiter::-webkit-scrollbar { display: none; }
.reiter button { flex: none; min-height: 44px; padding: 0 12px; font-family: var(--titel); font-weight: 700; font-size: 15px; letter-spacing: .04em; text-transform: uppercase; color: #9A9AA0; border-bottom: 4px solid transparent; }
.reiter button[aria-selected="true"] { color: #fff; border-bottom-color: var(--rot); }

.ziel-schalter { display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 12px 16px; border-radius: 12px; border: 2px solid var(--rot); background: var(--karte); text-align: left; width: 100%; }
.ziel-schalter.an { border-color: var(--dunkel); background: var(--dunkel); color: #fff; }
.ziel-schalter.an .klein { color: var(--hellgrau); }
.ziel-schalter .zeichen { font-size: 24px; font-weight: 700; color: var(--rot); }
.ziel-schalter.an .zeichen { color: #fff; }

.liste { margin: 4px 0 0; padding-left: 18px; font-size: 15px; line-height: 1.5; }
.bild-platz { border: 2px dashed var(--hellgrau); border-radius: 10px; background: #F7F7F8; min-height: 150px; display: grid; place-items: center; text-align: center; color: var(--grau); padding: 16px; }
.bild { width: 100%; border-radius: 12px; display: block; background: #fff; }
details.ablauf summary { cursor: pointer; color: var(--rot); font-weight: 700; padding: 10px 0; list-style: none; }
details.ablauf summary::-webkit-details-marker { display: none; }
details.ablauf summary::before { content: "▸ "; }
details.ablauf[open] summary::before { content: "▾ "; }

/* Checkliste */
.check { display: flex; align-items: center; gap: 14px; min-height: 56px; padding: 12px 14px; border-radius: 12px; background: var(--karte); box-shadow: 0 1px 2px rgba(20,20,22,.10); text-align: left; width: 100%; }
.check .box { width: 28px; height: 28px; flex: none; border-radius: 6px; border: 2px solid #B8B8BE; display: grid; place-items: center; color: #fff; font-weight: 700; }
.check.an .box { background: var(--gruen); border-color: var(--gruen); }
.fortschritt { height: 8px; border-radius: 4px; background: var(--dunkel2); overflow: hidden; margin-top: 6px; }
.fortschritt i { display: block; height: 100%; background: var(--rot); border-radius: 4px; transition: width .3s; }

/* Verein */
.tage { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 6px; }
.tage div { background: var(--dunkel); color: #fff; border-radius: 8px; padding: 10px 0; text-align: center; }
.tage b { font-family: var(--titel); font-size: 20px; display: block; }
.tage span { font-size: 12px; color: var(--hellgrau); }
.kontakt { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 48px; border-bottom: 1px solid #E6E6E9; }
.kontakt:last-child { border-bottom: 0; }
.kontakt .wert { font-weight: 700; user-select: all; overflow-wrap: anywhere; text-align: right; }
.kopieren { font-size: 13px; font-weight: 700; color: var(--rot); padding: 8px 4px; flex: none; }

/* dunkle Spielseiten */
.dunkle-seite { background: var(--dunkel); color: #fff; }
.dunkle-seite .klein { color: var(--hellgrau); }
.opt-btn { width: 100%; min-height: 60px; border-radius: 12px; background: var(--dunkel2); color: #fff; font-size: 17px; font-weight: 600; padding: 8px 12px; line-height: 1.25; }
.opt-btn small { display: block; font-size: 13px; color: rgba(255,255,255,.85); font-weight: 600; }
.opt-btn.richtig { background: var(--gruen); }
.opt-btn.falsch { background: var(--falsch); }
.quiz-opts .opt-btn { background: var(--dunkel); }

.kommando-mitte { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 16px; text-align: center; }
.kmd-ton { width: 140px; height: 140px; border-radius: 50%; background: var(--rot); display: grid; place-items: center; }
.kmd-ton svg { width: 60px; height: 60px; }
.kmd-wort { font-family: var(--titel); font-weight: 700; font-size: 30px; }
.unsichtbar { visibility: hidden; }

/* Lernkarten */
.lernkarte { flex: 1; min-height: 300px; border-radius: 16px; background: var(--karte); box-shadow: 0 2px 6px rgba(20,20,22,.14); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; text-align: center; padding: 20px; width: 100%; }
.lernkarte.hinten { background: var(--dunkel); color: #fff; }
.lernkarte .wort { font-family: var(--titel); font-weight: 700; font-size: 30px; line-height: 1.15; }
.lernkarte .hg { font-family: var(--kr); color: var(--rot); font-weight: 700; font-size: 18px; }
.zwei { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.zwei button { min-height: 64px; border-radius: 12px; font-weight: 700; font-size: 15px; line-height: 1.3; }
.btn-rand { border: 2px solid var(--dunkel); background: var(--karte); }
.btn-gruen { background: var(--gruen); color: #fff; }
.leiste { height: 4px; background: #DCDCE0; }
.leiste i { display: block; height: 100%; background: var(--rot); transition: width .3s; }

/* Quiz */
.frage { align-items: center; text-align: center; padding: 18px; border-radius: 16px; gap: 8px; }
.kat { font-size: 12px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: #fff; background: var(--rot); padding: 3px 10px; border-radius: 4px; }
.frage .wort { font-family: var(--titel); font-weight: 700; font-size: 28px; line-height: 1.2; text-wrap: balance; }
.frage .wort.lang { font-size: 21px; }
.quiz-opts { display: flex; flex-direction: column; gap: 10px; }

/* Kampf */
.tafel { display: flex; align-items: stretch; gap: 0; padding-block: 0 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: var(--dunkel); }
.tafel .seite-p { flex: 1; border-radius: 10px; padding: 6px; text-align: center; color: #fff; font-variant-numeric: tabular-nums; }
.tafel .hong { background: var(--rot); }
.tafel .chung { background: var(--chung); }
.tafel .nm { font-size: 12px; font-weight: 700; }
.tafel .pk { font-family: var(--titel); font-weight: 700; font-size: 34px; line-height: 1.1; }
.tafel .inf { font-size: 12px; }
.tafel .mitte { width: 84px; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #fff; }
.tafel .zeit { font-family: var(--titel); font-weight: 700; font-size: 26px; font-variant-numeric: tabular-nums; }
#kampfflaeche { flex: 1; min-height: 200px; position: relative; }
#kampfflaeche canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.k-tipp { color: #fff; font-weight: 700; font-size: 14px; text-align: center; padding-block: 8px 4px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); min-height: 44px; }
.k-steuer { padding-block: 4px 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-bottom: max(16px, env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 8px; }
.k-gitter { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.k-btn { min-height: 60px; border-radius: 12px; background: var(--dunkel2); color: #fff; font-size: 14px; font-weight: 700; padding: 6px; line-height: 1.25; }
.k-btn small { display: block; font-size: 11px; font-weight: 600; color: var(--hellgrau); }
.k-btn.dreh { background: #3A2A2E; }
.k-btn:active { filter: brightness(1.2); }
.k-karte { background: var(--dunkel2); border-radius: 12px; padding: 14px 16px; color: #fff; display: flex; flex-direction: column; gap: 6px; }
.abwehr-zeit { height: 6px; border-radius: 3px; background: var(--rot); margin: 0 auto; transition: width .1s linear; }

.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); max-width: min(440px, calc(100% - 32px)); background: var(--dunkel); color: #fff; padding: 12px 16px; border-radius: 10px; font-size: 14px; box-shadow: 0 4px 14px rgba(0,0,0,.35); z-index: 50; }
@media (min-width: 520px) { #app { box-shadow: 0 0 40px rgba(0,0,0,.5); } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

</head>

n. Keine neuen Techniken; die Techniken der ersten Form werden mit vielen Vorwärtstritten und Fauststößen zum Kopf variiert."}, {"id": "P03", "name": "Taeguk Sam Jang", "hangul": "태극 3장", "aussprache": "Tä-gük Sam Dschang", "stufe": 5, "symbol": "Feuer", "trigramm": "Ri (리)", "beschreibung": "Ri – das Haftende, Eigenschaft: leuchtend. 34 Bewegungen, energisch vorgetragen. Neu: Dwit-kubi, Han-sonnal-maki und Sonnal mok-chigi."}, {"id": "P04", "name": "Taeguk Sa Jang", "hangul": "태극 4장", "aussprache": "Tä-gük Sa Dschang", "stufe": 6, "symbol": "Donner", "trigramm": "Jin (진)", "beschreibung": "Jin – das Erregende, Eigenschaft: bewegend. 29 Bewegungen; hier beginnt der Fortgeschrittenenbereich. Neu: Sonnal momtong-maki, Pyonsonkut tzirugi, Jebipum mok-chigi, Yop-chagi, Bakkat-maki und Dung-jumok ap-chigi."}, {"id": "P05", "name": "Taeguk Oh Jang", "hangul": "태극 5장", "aussprache": "Tä-gük O Dschang", "stufe": 7, "symbol": "Wind", "trigramm": "Seon (손)", "beschreibung": "Seon – das Sanfte, Eigenschaft: eindringlich (Bild: Wind und Holz). 32 Bewegungen. Neu: Mejumok naeryo-chigi, Palkup dollyo-chigi, Palkup pyojok-chigi und Koa-sogi."}, {"id": "P06", "name": "Taeguk Yuk Jang", "hangul": "태극 6장", "aussprache": "Tä-gük Juk Dschang", "stufe": 8, "symbol": "Wasser", "trigramm": "Gam (감)", "beschreibung": "Gam – das Abgründige, Eigenschaft: gefährlich (Bild: Wasser). 31 Bewegungen, fließend und kraftvoll. Neu: Hansonnal bituro-maki, Batangson-maki und Dollyo-chagi – die einzige der 17 Poomsae mit Dollyo-chagi."}, {"id": "P07", "name": "Taeguk Chil Jang", "hangul": "태극 7장", "aussprache": "Tä-gük Tschil Dschang", "stufe": 9, "symbol": "Berg", "trigramm": "Gan (간)", "beschreibung": "Gan – das Stillehalten, Eigenschaft: ruhend (Bild: Berg). 33 Bewegungen. Neu: Bom-sogi, Juchum-sogi, Kawi-maki, Murup-chigi, Hecho-maki, Otkoro arae-maki, Pyojok-chagi und Yop-jirugi."}, {"id": "P08", "name": "Taeguk Pal Jang", "hangul": "태극 8장", "aussprache": "Tä-gük Pal Dschang", "stufe": 10, "symbol": "Erde", "trigramm": "Gon (곤)", "beschreibung": "Gon – das Empfangende, Eigenschaft: hingebend (Bild: Erde). 38 Bewegungen, zwei Kihaps; Hauptform zum 1. Dan. Neu: Koduro bakkat-maki, Koduro arae-maki, Dubal dangsong ap-chagi, Wesantul-maki und Dankyo tok-jirugi."}], "themen": [{"id": "W01", "titel": "Dojang-Etikette", "stufe": 1, "text": "Sicherheitsabstand, Verbeugung, Respekt vor Trainingspartnern, saubere Trainingskleidung."}, {"id": "W02", "titel": "Verhalten beim Training", "stufe": 1, "text": "Anweisungen beachten, Schmuck ablegen, Partner schützen, kontrollierte Bewegungen."}, {"id": "W03", "titel": "Koreanische Kommandos", "stufe": 1, "text": "Cha-ryeot, Kyeong-rye, Joon-bi, Shi-jak, Geu-man in deutscher Bedeutung."}, {"id": "W04", "titel": "Angriffs- und Körperzonen", "stufe": 2, "text": "Arae, Momtong, Eolgul unterscheiden."}, {"id": "W05", "titel": "Partnertraining", "stufe": 2, "text": "Distanz und Schutzausrüstung; Techniken kontrollieren und bei Unsicherheit stoppen."}, {"id": "W06", "titel": "Grundtechnik erklären", "stufe": 3, "text": "Ausgangsstellung, Bewegungsweg, Trefferfläche und Rückführung benennen."}, {"id": "W07", "titel": "Notwehr-Grundidee", "stufe": 4, "text": "Selbstschutz, Erforderlichkeit, Verhältnismäßigkeit im konkreten Kontext; kein Rechtsrat."}, {"id": "W08", "titel": "Werte des Taekwondo", "stufe": 5, "text": "Respekt, Selbstkontrolle, Ausdauer, Disziplin und Verantwortung."}, {"id": "W09", "titel": "Wettkampf-Grundlagen", "stufe": 6, "text": "Schutz, erlaubte Techniken und Strafpunkte; aktuelle Regeln vor Anwendung prüfen."}, {"id": "W10", "titel": "Körperliche Zielbereiche", "stufe": 6, "text": "Körperzonen im Training und besondere Schutzbedürftigkeit verstehen."}, {"id": "W11", "titel": "Trainingsaufbau", "stufe": 7, "text": "Aufwärmen, Technik, Partnerarbeit, Abwärmen und Regeneration erklären."}, {"id": "W12", "titel": "Technikprinzipien", "stufe": 8, "text": "Balance, Hüfteinsatz, Distanz, Deckung, Präzision und Atmung erklären."}, {"id": "W13", "titel": "Verbandsstruktur", "stufe": 9, "text": "Rolle der DTU und des Landesverbands erläutern."}, {"id": "W14", "titel": "Trainingslehre", "stufe": 9, "text": "Belastung, Erholung, Zielsetzung und sicherer Fortschritt."}, {"id": "W15", "titel": "Vorprogramm", "stufe": 10, "text": "Frühere Anforderungen wiederholen und praktisch erklären."}, {"id": "W16", "titel": "Prüfungsfach reflektieren", "stufe": 10, "text": "Ausgewählte Übungen erklären: Sinn, Sicherheitsregeln, typische Fehler."}, {"id": "H01", "titel": "Was bedeutet Taekwondo?", "stufe": 1, "text": "Tae = Fuß, Kwon = Faust, Do = Weg. Taekwondo ist eine koreanische Kampfkunst und seit 2000 olympische Sportart."}, {"id": "H02", "titel": "Kihap", "stufe": 1, "text": "Ki = Energie, Hap = Harmonie: ein kurzer Ruf aus dem Unterbauch, der die Kraft am Ende einer Technik bündelt. Er beginnt und endet mit der Technik."}, {"id": "H03", "titel": "Grundprinzipien der Technik", "stufe": 2, "text": "Locker bewegen und erst am Ende anspannen, Gleichgewicht halten, Hüfte einsetzen, mit der Gegenhand zurückziehen und beim Beschleunigen ausatmen."}, {"id": "H04", "titel": "Taeguk und die acht Trigramme", "stufe": 3, "text": "Taeguk bedeutet „große Ewigkeit“. Die acht Taeguk-Formen beruhen auf den acht Trigrammen (Gwae) des I Ging: Keon, Tae, Ri, Jin, Seon, Gam, Gan und Gon."}, {"id": "H05", "titel": "Partnerübungen (Taeryon)", "stufe": 3, "text": "Sambo-taeryon = Drei-Schritt-, Ibo-taeryon = Zwei-Schritt-, Ilbo-taeryon = Ein-Schritt-Übung. In der Kup-Prüfung wird die Ein-Schritt-Übung verlangt."}, {"id": "H06", "titel": "Koreanische Flagge (Taegukgi)", "stufe": 5, "text": "In der Mitte das Taeguk-Zeichen: rot oben für das aktive, blau unten für das passive Prinzip. Darum vier Trigramme aus dem I Ging."}, {"id": "H07", "titel": "Geschichte des Taekwondo", "stufe": 5, "text": "Nach 1945 entstanden in Korea mehrere Kampfkunstschulen (Kwans). Mitte der 1950er-Jahre kam der Name Taekwondo auf. 1972 wurde das Kukkiwon in Seoul eröffnet, 1973 die WTF gegründet (heute World Taekwondo)."}, {"id": "H08", "titel": "Taekwondo in Deutschland", "stufe": 5, "text": "Anfang der 1960er brachten koreanische Bergleute Taekwondo ins Ruhrgebiet. Die Deutsche Taekwondo Union (DTU) wurde 1981 gegründet. 1979 wurde Rainer Müller erster deutscher Weltmeister."}, {"id": "H09", "titel": "Bruchtest (Gyeokpa)", "stufe": 6, "text": "Ablauf: Helfer halten das Brett, Verbeugung und Ansage der Technik, ein- bis zweimal Maß nehmen, dann Ausführung mit Kihap. Bretter aus Fichte, etwa 30 × 30 cm."}, {"id": "H10", "titel": "Kommandos im Wettkampf", "stufe": 6, "text": "Charyeot (Achtung), Gyeongrye (Verbeugen), Junbi (bereit), Sijak (Beginn), Gallyeo (Trennen), Gyesok (Weiter), Geuman (Ende). Gyeonggo = Verwarnung, Gamjeom = Minuspunkt, Hong/Chung Seung = Sieger Rot/Blau."}, {"id": "H11", "titel": "Prüfungsbewertung", "stufe": 6, "text": "Die Prüfer bewerten jedes Fach mit Punkten. Ab einem Durchschnitt von 4,0 Punkten ist die Prüfung bestanden."}, {"id": "H12", "titel": "Poomsae-Wettkampf", "stufe": 8, "text": "Maximal 10 Punkte: je 5 für Technik und Präsentation. Leichte Fehler kosten 0,1, schwere 0,5 Punkte."}, {"id": "H13", "titel": "Dan-Formen", "stufe": 10, "text": "Insgesamt gibt es 17 Poomsae: 8 Taeguk und 9 Schwarzgurtformen – Koryo, Kumgang, Taebaek, Pyongwon, Sipjin, Jitae, Chonkwon, Hansu und Ilyo."}, {"id": "H14", "titel": "Poom", "stufe": 10, "text": "Unter 15 Jahren erhält man statt des Dan den Poom-Grad mit rot-schwarzem Gürtel."}], "wissen": [{"id": "W01", "frage": "Was bedeutet „Do“ in Taekwondo?", "richtig": "der Weg", "falsch": ["die Faust", "der Fuß", "die Kraft"], "stufe": 1}, {"id": "W02", "frage": "Was bedeutet „Kwon“ in Taekwondo?", "richtig": "die Faust", "falsch": ["der Weg", "der Fuß", "die Schule"], "stufe": 1}, {"id": "W03", "frage": "Was bedeutet „Tae“ in Taekwondo?", "richtig": "der Fuß", "falsch": ["die Faust", "der Weg", "die Hand"], "stufe": 1}, {"id": "W04", "frage": "Was bedeutet Kihap wörtlich?", "richtig": "Energie und Harmonie", "falsch": ["lauter Schrei", "Atem anhalten", "Gruß an den Meister"], "stufe": 1}, {"id": "W05", "frage": "Was legt man vor dem Training ab?", "richtig": "Uhren und Schmuck", "falsch": ["den Dobok", "den Gürtel", "die Schutzweste"], "stufe": 1}, {"id": "W06", "frage": "Wann verbeugt man sich im Dojang?", "richtig": "beim Betreten und Verlassen", "falsch": ["nur bei Prüfungen", "nur vor dem Freikampf", "nie"], "stufe": 1}, {"id": "W07", "frage": "Ab welchem Punktedurchschnitt ist eine Prüfung bestanden?", "richtig": "4,0", "falsch": ["3,0", "5,0", "2,5"], "stufe": 1}, {"id": "W08", "frage": "Was ist Ilbo-daeryeon?", "richtig": "Ein-Schritt-Übung", "falsch": ["Zwei-Schritt-Übung", "Freikampf", "Formenlauf"], "stufe": 1}, {"id": "W09", "frage": "Was bedeutet Taeguk?", "richtig": "große Ewigkeit", "falsch": ["großer Kampf", "Weg der Faust", "Erde"], "stufe": 3}, {"id": "W10", "frage": "Wie heißen die Trigramme auf Koreanisch?", "richtig": "Gwae", "falsch": ["Jang", "Poom", "Kup"], "stufe": 3}, {"id": "W11", "frage": "Was ist Koa-sogi?", "richtig": "Kreuzstand", "falsch": ["Tigerstand", "Reiterstand", "Rückwärtsstand"], "stufe": 7}, {"id": "W12", "frage": "Welche Stellung kommt in Taeguk Sam Jang neu hinzu?", "richtig": "Dwit-kubi", "falsch": ["Bom-sogi", "Juchum-sogi", "Koa-sogi"], "stufe": 5}, {"id": "W13", "frage": "Wofür steht Rot im Taeguk-Zeichen?", "richtig": "das aktive Prinzip", "falsch": ["das passive Prinzip", "die Erde", "das Wasser"], "stufe": 5}, {"id": "W14", "frage": "Seit wann ist Taekwondo offiziell olympisch?", "richtig": "2000 (Sydney)", "falsch": ["1988 (Seoul)", "1992 (Barcelona)", "2004 (Athen)"], "stufe": 5}, {"id": "W15", "frage": "Wann wurde die DTU gegründet?", "richtig": "1981", "falsch": ["1973", "1971", "1988"], "stufe": 5}, {"id": "W16", "frage": "Wann wurde die WTF (heute World Taekwondo) gegründet?", "richtig": "1973", "falsch": ["1981", "1955", "1988"], "stufe": 5}, {"id": "W17", "frage": "Was ist das Kukkiwon?", "richtig": "die Welt-Taekwondo-Zentrale in Seoul", "falsch": ["der deutsche Verband", "eine Gürtelfarbe", "eine Schwarzgurtform"], "stufe": 5}, {"id": "W18", "frage": "Ab welcher Prüfung gibt es den ersten Bruchtest?", "richtig": "zum 4. Kup (Blaugurt)", "falsch": ["zum 7. Kup", "zum 8. Kup", "zum 1. Dan"], "stufe": 6}, {"id": "W19", "frage": "Welche Brettstärke gilt für Männer von 18 bis 49 Jahren?", "richtig": "3 cm", "falsch": ["2 cm", "1 cm", "4 cm"], "stufe": 6}, {"id": "W20", "frage": "In welcher Form kommt Dollyo-chagi vor?", "richtig": "Taeguk Yuk Jang", "falsch": ["Taeguk Il Jang", "Taeguk Sa Jang", "Taeguk Pal Jang"], "stufe": 8}, {"id": "W21", "frage": "Welcher Stand heißt Tigerstand?", "richtig": "Bom-sogi", "falsch": ["Juchum-sogi", "Dwit-kubi", "Koa-sogi"], "stufe": 9}, {"id": "W22", "frage": "Wie viele Poomsae gibt es insgesamt?", "richtig": "17", "falsch": ["8", "9", "24"], "stufe": 10}, {"id": "W23", "frage": "Welche Form gehört zum 2. Dan?", "richtig": "Koryo", "falsch": ["Kumgang", "Taebaek", "Sipjin"], "stufe": 10}, {"id": "W24", "frage": "Wie heißt der Meistergrad für Kinder unter 15?", "richtig": "Poom", "falsch": ["Dan", "Kup", "Ti"], "stufe": 10}, {"id": "W25", "frage": "Wie viele Kihaps hat Taeguk Pal Jang?", "richtig": "zwei", "falsch": ["einen", "drei", "keinen"], "stufe": 10}]}

<script>

const LAUT = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5L6 9H3v6h3l5 4V5z" fill="#fff"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>';

// ---------- kleine Helfer ----------
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const mischen = a => { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };
const zz = n => Math.floor(Math.random() * n);

// ---------- Sprachausgabe (Stimme des Geräts) ----------

try { if (window.speechSynthesis) speechSynthesis.onvoiceschanged = stimmenLaden; } catch (e) { }

  const u = new SpeechSynthesisUtterance(text);

  speechSynthesis.cancel();
  speechSynthesis.speak(u);

function sprichDeutsch(t) { if (window.speechSynthesis && speechSynthesis.speaking) { speechSynthesis.cancel(); return; } sag(t, "de", 1); }

// ---------- Navigation ----------

// ---------- Ziel-Gurt & Checkliste ----------

function checkliste(g) {
  const l = [];
  const dazu = (t, w) => { if (w && w !== "—" && w !== "Kein Wahlpflichtteil") l.push([t, w.split("\n")[0].replace(/; /g, " · ")]); };
  dazu("Poomsae", g.poomsae); dazu("Technik / Grundschule", g.technik); dazu("Zweikampf / Pratzen", g.zweikampf);
  dazu("Theorie", g.theorie); dazu("Bruchtest", g.bruchtest); dazu("Wahlpflicht", g.wahlpflicht);
  const nb = D.begriffe.filter(w => w.stufe === g.stufe).length;
  if (nb > 0) l.push(["Neue Begriffe", nb + " Begriffe für diesen Gurt"]);
  return l;
}
const abgehakt = (g, i) => !!lesen("check_" + g.stufe + "_" + i, false);
function prozent(g) { const l = checkliste(g); if (!l.length) return 0; return Math.round(l.filter((_, i) => abgehakt(g, i)).length * 100 / l.length); }

// ---------- Bausteine ----------
const gurtMuster = (g, w, h) => `<span class="gurt" style="width:${w}px;height:${h}px;background:${g.farbe}">${g.streifen !== g.farbe ? `<i style="height:${Math.round(h / 3)}px;background:${g.streifen}"></i>` : ""}</span>`;
const lautBtn = (hangul, extra = "") => `<button class="laut ${extra}" data-ko="${esc(hangul)}" aria-label="Aussprache anhören">${LAUT}</button>`;
function kopf(titel, unter, rechts = "", strich = true) {
  return `<header class="kopf auf-dunkel"><div class="zeile"><button class="rund-btn" data-zurueck aria-label="Zurück">←</button><h1 class="h-titel">${esc(titel)}</h1>${rechts}</div>${strich ? '<div class="strich"></div>' : ""}${unter ? `<div class="unter">${esc(unter)}</div>` : ""}</header>`;
}
function eintrag(ko, hangul, aus, de, extra = "", pfeil = false) {
  return `<div class="eintrag" ${extra}><div class="txt"><span class="ko">${esc(ko)}<span class="hangul">${esc(hangul)}</span></span><span class="aus">[${esc(aus)}]</span><span class="de">${esc(de)}</span></div>${pfeil ? '<span class="pfeil" aria-hidden="true">›</span>' : ""}${lautBtn(hangul)}</div>`;
}
function bildOderPlatz(id) {
  const n = id.toLowerCase();
  return `<img class="bild" src="img/${n}.webp" alt="" loading="lazy" onerror="this.outerHTML='<div class=&quot;bild-platz&quot;><div><b>Bild folgt</b><div class=&quot;mini&quot;>${n}.webp</div></div></div>'">`;
}

// ---------- Kommando-Trainer ----------
const KMD = { stapel: [], akt: null, opts: [], fehler: false, gesperrt: false, serie: 0, zeit: "–", start: 0 };
const kommandoPool = () => D.begriffe.filter(w => w.kategorie === "Kommandos" || w.kategorie === "Zahlen");
function starteKommandos() { Object.assign(KMD, { stapel: [], akt: null, serie: 0, zeit: "–" }); }
function naechstesKommando() {
  const pool = kommandoPool();
  if (!KMD.stapel.length) KMD.stapel = mischen(pool);
  let w = KMD.stapel.shift();
  if (w === KMD.akt && KMD.stapel.length) w = KMD.stapel.shift();
  KMD.akt = w;
  KMD.opts = mischen(mischen(pool.filter(x => x.kategorie === w.kategorie && x.deutsch !== w.deutsch)).slice(0, 3).concat([w]));
  KMD.fehler = false; KMD.gesperrt = false;
}
SEITEN.kommando = () => {
  if (!KMD.akt) naechstesKommando();
  const w = KMD.akt;

const KA = { stapel: [], fertig: [], gesamt: 0, hinten: false };

// ---------- Quiz ----------
const Q = { gurt: null, vorlagen: [], stapel: [], akt: null, gesperrt: false, fehler: false, serie: 0 };
function dreiAndere(alle, richtig, key, gleich) {
  const r = key(richtig), gesehen = new Set([r]), andere = [];
  alle.forEach(x => { const k = key(x); if (!gesehen.has(k)) { gesehen.add(k); andere.push(x); } });
  return mischen(andere.filter(gleich)).concat(mischen(andere.filter(x => !gleich(x)))).slice(0, 3);
}
const ant = (text, aus) => ({ text, aus });
function frage(kat, aufgabe, wort, hangul, aus, richtig, falsch, ton) { return { kat, aufgabe, wort, hangul, aus, richtig, opts: mischen(falsch.concat([richtig])), ton }; }
function starteQuiz(g) {
  const v = [];
  D.techniken.filter(t => t.stufe >= 1 && t.stufe <= g.stufe).forEach(t => v.push(() => {
    const r = ant(t.koreanisch, t.aussprache);
    return frage("Technik · " + t.kategorie, "Wie heißt auf Koreanisch?", t.deutsch, null, null, r, dreiAndere(D.techniken, t, x => x.koreanisch, x => x.kategorie === t.kategorie).map(x => ant(x.koreanisch, x.aussprache)), t.hangul);
  }));
  D.begriffe.filter(w => w.stufe >= 1 && w.stufe <= g.stufe).forEach(w => {
    v.push(() => frage("Begriff · " + w.kategorie, "Was bedeutet?", w.koreanisch, w.hangul, w.aussprache, ant(w.deutsch), dreiAndere(D.begriffe, w, x => x.deutsch, x => x.kategorie === w.kategorie).map(x => ant(x.deutsch)), w.hangul));
    v.push(() => frage("Begriff · " + w.kategorie, "Wie heißt auf Koreanisch?", w.deutsch, null, null, ant(w.koreanisch, w.aussprache), dreiAndere(D.begriffe, w, x => x.koreanisch, x => x.kategorie === w.kategorie).map(x => ant(x.koreanisch, x.aussprache)), w.hangul));
  });
  D.formen.filter(f => f.stufe >= 1 && f.stufe <= g.stufe).forEach(f => {
    v.push(() => frage("Poomsae", "Wofür steht diese Form?", f.name, f.hangul, f.aussprache, ant(f.symbol), dreiAndere(D.formen, f, x => x.symbol, () => true).map(x => ant(x.symbol)), f.hangul));
    v.push(() => { const gg = D.guertel[f.stufe]; return frage("Poomsae", "Welche Form gehört zur Prüfung zum " + gg.grad + "?", gg.name, null, null, ant(f.name, f.aussprache), dreiAndere(D.formen, f, x => x.name, () => true).map(x => ant(x.name, x.aussprache)), f.hangul); });
  });
  D.wissen.filter(w => w.stufe <= g.stufe).forEach(w => v.push(() => frage("Wissen", "Wissensfrage", w.frage, null, null, ant(w.richtig), w.falsch.map(x => ant(x)), "")));
  Object.assign(Q, { gurt: g, vorlagen: v, stapel: [], akt: null, serie: 0 });
}
function naechsteFrage() {
  if (!Q.stapel.length) Q.stapel = mischen(Q.vorlagen);
  let f = Q.stapel.shift()();
  if (Q.akt && f.wort === Q.akt.wort) { if (!Q.stapel.length) Q.stapel = mischen(Q.vorlagen); f = Q.stapel.shift()(); }
  Q.akt = f; Q.gesperrt = false; Q.fehler = false;
}

const POSE = o => Object.assign({ lean: 6, sF: 45, eF: 95, sB: 20, eB: 120, hF: 18, kF: -8, hB: -22, kB: -4, dx: 0, dy: 0 }, o);
const P = {
  HOCH: POSE({}), TIEF: POSE({ sF: 25, eF: 70, sB: 10, eB: 80 }),
  FAUST: POSE({ lean: 16, sB: 88, eB: 4, sF: 30, eF: 110, dx: 6 }),
  KOERPER: POSE({ lean: -28, hB: 92, kB: 0, hF: -6, kF: 0, sF: 30, eF: 60, sB: -20, eB: 40 }),
  KOPF: POSE({ lean: -42, hB: 138, kB: 0, hF: -8, kF: 0, sF: 20, eF: 50, sB: -30, eB: 30 }),
  AXT: POSE({ lean: -20, hB: 160, kB: 0, hF: -4, kF: 0, sF: 30, eF: 60, sB: -10, eB: 40 }),
  DREHK: POSE({ lean: 32, hB: -96, kB: 0, hF: 8, kF: 0, sF: 60, eF: 60, sB: 40, eB: 60 }),
  DREHKOPF: POSE({ lean: 45, hB: -140, kB: 0, hF: 10, kF: 0, sF: 70, eF: 50, sB: 50, eB: 50 }),
  BLOCK: POSE({ lean: -4, sF: 70, eF: 70, sB: 50, eB: 100, dx: -3 }),
  TREFFER: POSE({ lean: -22, sF: 10, eF: 40, sB: -10, eB: 40, dx: -10, hF: 10, kF: -15, hB: -30, kB: 0 }),
  AUSWEICHEN: POSE({ lean: -10, dx: -26 })
};
const glatt = x => x * x * (3 - 2 * x);
const mische = (a, b, f) => { const o = {}; for (const k in a) o[k] = a[k] + (b[k] - a[k]) * f; return o; };

class Kaempfer {
  constructor(farbe, blick) { this.farbe = farbe; this.blick = blick; this.x = 0; this.zielX = 0; this.basis = P.HOCH; this.ziel = null; }
  aktion(p, dauer = 600, dreh = false, vorschub = 0) { this.ziel = Object.assign({}, p, { dx: p.dx + vorschub }); this.dreh = dreh; this.dauer = dauer; this.start = performance.now(); }
  jetzt(t) {
    if (!this.ziel) return [this.basis, false];
    const p = (t - this.start) / this.dauer;
    if (p >= 1) { this.ziel = null; return [this.basis, false]; }
    const f = p < .35 ? glatt(p / .35) : p < .6 ? 1 : 1 - glatt((p - .6) / .4);
    return [mische(this.basis, this.ziel, f), this.dreh && f > .3];
  }
}

class KampfBild {
  constructor(huelle) {
    this.c = document.createElement("canvas");
    this.c.setAttribute("aria-label", "Kampffläche: Hong (rot) gegen Chung (blau)");
    this.c.setAttribute("role", "img");
    huelle.appendChild(this.c);
    this.g = this.c.getContext("2d");
    this.hong = new Kaempfer("#D7192A", 1);
    this.chung = new Kaempfer("#1F5FD1", -1);
    this.anzeigen = []; this.ansageText = ""; this.ansageStart = 0; this.nah = false;
    this.groesse(); this.hong.x = this.hong.zielX; this.chung.x = this.chung.zielX;
    this.ro = new ResizeObserver(() => this.groesse()); this.ro.observe(huelle);
    this.laeuft = true;
    const schleife = () => { if (!this.laeuft) return; this.zeichnen(); requestAnimationFrame(schleife); };
    requestAnimationFrame(schleife);
  }
  stopp() { this.laeuft = false; this.ro.disconnect(); }
  groesse() {
    const r = this.c.parentElement.getBoundingClientRect(), d = window.devicePixelRatio || 1;
    this.w = r.width; this.h = r.height;
    this.c.width = Math.round(this.w * d); this.c.height = Math.round(this.h * d);
    this.g.setTransform(d, 0, 0, d, 0, 0);
    this.s = Math.min(this.h / 160, this.w / 230); this.boden = this.h * .86;
    this.positionen();
  }
  positionen() { const ab = (this.nah ? 52 : 90) * this.s; this.hong.zielX = this.w / 2 - ab / 2; this.chung.zielX = this.w / 2 + ab / 2; }
  setzeAbstand(n) { this.nah = n; this.positionen(); }
  setzeDeckung(hoch) { this.chung.basis = hoch ? P.HOCH : P.TIEF; }
  anzeige(text, farbe, ueberChung, kopf, gross = true) { const k = ueberChung ? this.chung : this.hong; this.anzeigen.push({ text, farbe, k, kopf, gross, start: performance.now() }); }
  ansage(t) { this.ansageText = t; this.ansageStart = performance.now(); }
  zeichnen() {
    const g = this.g, w = this.w, h = this.h, s = this.s, b = this.boden, t = performance.now();
    const gr = g.createLinearGradient(0, 0, 0, b); gr.addColorStop(0, "#26262B"); gr.addColorStop(1, "#141416");
    g.fillStyle = gr; g.fillRect(0, 0, w, b);
    g.fillStyle = "#1D4E9E"; g.fillRect(0, b, w, h - b);
    g.fillStyle = "#F2C500"; g.fillRect(w * .06, b, w * .88, 3 * s);
    g.fillStyle = "#D7192A"; g.fillRect(0, b, w * .06, h); g.fillRect(w * .94, b, w * .06, h);
    g.strokeStyle = "rgba(255,255,255,.5)"; g.lineWidth = 1.5 * s; g.beginPath(); g.moveTo(w / 2, b + 6 * s); g.lineTo(w / 2, h); g.stroke();
    for (const k of [this.hong, this.chung]) { k.x += Math.abs(k.zielX - k.x) > .5 ? (k.zielX - k.x) * .18 : k.zielX - k.x; }
    this.figur(this.hong, t); this.figur(this.chung, t);
    g.textAlign = "center";
    this.anzeigen = this.anzeigen.filter(a => {
      const p = (t - a.start) / 1100; if (p >= 1) return false;
      const y = b - (a.kopf ? 112 : 70) * s - p * 30 * s;
      g.font = `700 ${(a.gross ? 26 : 16) * s}px Oswald, "Arial Narrow", sans-serif`;
      g.globalAlpha = (1 - p) * .6; g.fillStyle = "#000"; g.fillText(a.text, a.k.x + 1.5 * s, y + 1.5 * s);
      g.globalAlpha = 1 - p; g.fillStyle = a.farbe; g.fillText(a.text, a.k.x, y);
      g.globalAlpha = 1; return true;
    });
    if (this.ansageText) {
      const p = (t - this.ansageStart) / 1500;
      if (p < 1) {
        g.globalAlpha = p < .7 ? 1 : (1 - p) / .3;
        g.font = `700 ${Math.min(28 * s, w / 8)}px Oswald, "Arial Narrow", sans-serif`;
        g.shadowColor = "#000"; g.shadowBlur = 8 * s; g.fillStyle = "#fff"; g.fillText(this.ansageText, w / 2, h * .3);
        g.shadowBlur = 0; g.globalAlpha = 1;

  }
  figur(k, t) {
    const g = this.g, s = this.s;
    const [p, gedreht] = k.jetzt(t);
    const bl = gedreht ? -k.blick : k.blick;
    const pt = (v, a, l) => { const r = a * Math.PI / 180; return [v[0] + Math.sin(r) * l * s * bl, v[1] + Math.cos(r) * l * s]; };
    const L = (a, e, c, wd) => { g.strokeStyle = c; g.lineWidth = wd * s; g.lineCap = "round"; g.beginPath(); g.moveTo(a[0], a[1]); g.lineTo(e[0], e[1]); g.stroke(); };
    const C = (q, r, c) => { g.fillStyle = c; g.beginPath(); g.arc(q[0], q[1], r * s, 0, Math.PI * 2); g.fill(); };
    const hu = [k.x + p.dx * s * k.blick, this.boden - 45 * s + p.dy * s];
    g.fillStyle = "rgba(0,0,0,.25)"; g.beginPath(); g.ellipse(hu[0], this.boden + 1 * s, 18 * s, 3 * s, 0, 0, Math.PI * 2); g.fill();
    const kB = pt(hu, p.hB, 23), fB = pt(kB, p.hB + p.kB, 22), kF = pt(hu, p.hF, 23), fF = pt(kF, p.hF + p.kF, 22);
    L(hu, kF, "#B9B9C2", 8); L(kF, fF, "#B9B9C2", 7); L(fF, pt(fF, p.hF + p.kF + 90, 4), k.farbe, 4);
    const o = 180 - p.lean, sch = pt(hu, o, 28), hals = pt(hu, o, 32), kopf = pt(hu, o, 42);
    const eB = pt(sch, p.sB, 14), hB = pt(eB, p.sB + p.eB, 13); L(sch, eB, "#B9B9C2", 6.5); L(eB, hB, "#B9B9C2", 6); C(hB, 3.6, k.farbe);
    L(hu, hals, "#F4F4F6", 15); L(pt(hu, o, 6), pt(hu, o, 25), k.farbe, 18);
    const m = pt(hu, o, 15); g.strokeStyle = "#fff"; g.lineWidth = 1.2 * s; g.beginPath(); g.arc(m[0], m[1], 4 * s, 0, Math.PI * 2); g.stroke();
    L(pt(hu, o, 2), pt(hu, o, 3), "#141416", 16);
    L(hu, kB, "#F4F4F6", 8.5); L(kB, fB, "#F4F4F6", 7.5); L(fB, pt(fB, p.hB + p.kB + 90, 4), k.farbe, 4.5);
    C(kopf, 9.5, k.farbe); C([kopf[0] + 3.5 * s * bl, kopf[1] + s], 5.5, "#E9C29E"); C([kopf[0] + 6 * s * bl, kopf[1] - .5 * s], .9, "#141416");
    const eF = pt(sch, p.sF, 14), hF = pt(eF, p.sF + p.eF, 13); L(sch, eF, "#F4F4F6", 7); L(eF, hF, "#F4F4F6", 6.5); C(hF, 3.8, k.farbe);
  }
}

  { name: "Naeryeo-chagi", hg: "내려차기", aus: "Nä-rjo tscha-gi", de: "Abwärtstritt zum Kopf", p: 3, kopf: true, dreh: false, pose: P.AXT, nah: .55, mittel: .4, art: 2 },
  { name: "Dwi-chagi", hg: "뒤차기", aus: "Dwi tscha-gi", de: "Gedrehter Rückwärtstritt zum Körper", p: 4, kopf: false, dreh: true, pose: P.DREHK, nah: .35, mittel: .6, art: 3 },
  { name: "Dwi-huryeo-chagi", hg: "뒤후려차기", aus: "Dwi hu-rjo tscha-gi", de: "Gedrehter Hakentritt zum Kopf", p: 5, kopf: true, dreh: true, pose: P.DREHKOPF, nah: .2, mittel: .4, art: 3 }
];
const SEK = 60;

const K = {
  bild: null, punkte: [0, 0], gj: [0, 0], siege: [0, 0], art: [[0, 0, 0, 0], [0, 0, 0, 0]], runde: 1, zehntel: SEK * 10,
  laeuft: false, modus: 5, nah: false, hoch: true, sperre: 0, lage: 0, angriffAb: 0, gjAb: 0, abwehrEnde: 0, angriff: null,
  ergebnis: "", meldung: "", meldungBis: 0, timer: [], takt: 0,
  neu() { this.siege = [0, 0]; this.runde = 1; this.modus = 5; this.laeuft = false; this.punkte = [0, 0]; this.gj = [0, 0]; this.zehntel = SEK * 10; this.meldung = ""; },
  spaeter(fn, ms) { const id = setTimeout(fn, ms); this.timer.push(id); },
  stopp() { this.timer.forEach(clearTimeout); this.timer = []; clearInterval(this.takt); this.takt = 0; },
  jetzt: () => performance.now()
};

function starteRunde() {
  K.stopp();
  K.punkte = [0, 0]; K.gj = [0, 0]; K.art = [[0, 0, 0, 0], [0, 0, 0, 0]]; K.zehntel = SEK * 10;
  K.laeuft = false; K.modus = 0; K.nah = false; K.hoch = true; K.meldung = "";
  if (K.bild) { K.bild.setzeAbstand(false); K.bild.setzeDeckung(true); K.bild.ansage(K.runde + ". RUNDE"); }
  kampfAnzeige(); steuerung(); tipp();
  K.spaeter(() => { K.bild && K.bild.ansage("JOON-BI"); sprich("준비"); }, 1300);
  K.spaeter(() => {
    K.bild && K.bild.ansage("SHI-JAK!"); sprich("시작");
    const t = K.jetzt();
    K.lage = t + 2500; K.angriffAb = t + 4500 + zz(2500); K.gjAb = t + 15000 + zz(10000); K.sperre = 0;
    K.laeuft = true; K.modus = 1; steuerung(); tipp();
    K.takt = setInterval(kampfTakt, 100);
  }, 2600);
}

function kampfTakt() {
  if (!K.laeuft) return;
  const t = K.jetzt();
  if (K.modus !== 2) K.zehntel--;
  if (K.zehntel % 10 === 0) kampfAnzeige();
  if (K.modus === 1 && t > K.lage && t > K.sperre) {
    K.nah = Math.random() < .4; K.hoch = Math.random() < .5;
    K.bild.setzeAbstand(K.nah); K.bild.setzeDeckung(K.hoch);
    K.lage = t + 2200 + zz(1800); tipp();
  }
  if (K.modus === 1 && t > K.angriffAb && t > K.sperre) chungGreiftAn();
  if (K.modus === 2) {
    const bar = document.getElementById("abwehrZeit");
    if (bar) bar.style.width = Math.max(0, (K.abwehrEnde - t) / 1700 * 100) + "%";
    if (t > K.abwehrEnde) abwehr(-1, "");
  }
  if (K.modus === 1 && t > K.gjAb && t > K.sperre) {
    const gr = ["über die Begrenzungslinie getreten", "den Gegner festgehalten", "dem Kampf ausgewichen (Passivität)", "unter die Gürtellinie getreten"];
    gamJeom(1, gr[zz(gr.length)]);
    K.gjAb = t + 16000 + zz(12000);
  }
  if (K.meldung && t > K.meldungBis) { K.meldung = ""; tipp(); }
  if (!K.laeuft) return;
  if (K.zehntel <= 0) zeitUm();
}

function meldung(s) { K.meldung = s; K.meldungBis = K.jetzt() + 2200; tipp(); }
function tipp() {
  const el = document.getElementById("kTipp"); if (!el) return;
  if (K.meldung) { el.textContent = K.meldung; return; }
  el.textContent = K.modus === 1 ? (K.nah ? "Nah dran → Jireugi oder Naeryeo-chagi" : "Mittlere Distanz → Rund- und Drehtritte") + " · " + (K.hoch ? "Deckung oben → Körper offen" : "Deckung unten → Kopf offen!")
    : K.modus === 2 ? "Chung greift an – reagiere schnell!" : K.modus === 0 ? "Gleich geht es los …" : "";
}
function punkte(wer, p, art) {
  K.punkte[wer] += p; if (art >= 0) K.art[wer][art] += p;
  kampfAnzeige();
  if (K.punkte[wer] - K.punkte[1 - wer] >= 12) rundeEnde(wer, "12 Punkte Vorsprung");
}
function gamJeom(wer, grund) {
  K.gj[wer]++;
  const name = wer === 0 ? "Hong (du)" : "Chung", andere = wer === 0 ? "Chung" : "Hong";
  K.bild.ansage("GAM-JEOM"); sprich("감점");
  meldung(`Gam-jeom für ${name}: ${grund} → +1 Punkt für ${andere}`);
  K.bild.anzeige("+1", wer === 0 ? "#7FB2FF" : "#FF8A94", wer === 0, false);
  if (K.gj[wer] >= 5) { kampfAnzeige(); rundeEnde(1 - wer, `5 Gam-jeom für ${name}`); return; }
  punkte(1 - wer, 1, -1);
}
const vorschubFuer = tc => K.nah ? (tc.art === 0 ? 0 : 6) : (tc.kopf ? 42 : 32);
function angriff(tc) {
  const v = K.bild, t = K.jetzt();
  if (!K.laeuft || K.modus !== 1 || t < K.sperre) return;
  K.sperre = t + 950;
  let ch = K.nah ? tc.nah : tc.mittel;
  ch *= tc.kopf ? (K.hoch ? .4 : 1) : tc.art === 0 ? (K.hoch ? 1 : .75) : (K.hoch ? 1 : .6);
  v.hong.aktion(tc.pose, 650, tc.dreh, vorschubFuer(tc));
  sprich(tc.hg);
  const treffer = Math.random() < ch;
  K.spaeter(() => {
    if (!K.laeuft) return;
    if (treffer) {
      v.chung.aktion(P.TREFFER, 520); v.anzeige("+" + tc.p, "#FFD54A", true, tc.kopf);
      meldung(`Treffer! ${tc.name} = ${tc.p} ${punktWort(tc.p)}`);
      punkte(0, tc.p, tc.art);
    } else {
      v.chung.aktion(P.BLOCK, 520); v.anzeige("Geblockt", "#fff", true, tc.kopf, false);
      if (tc.dreh && Math.random() < .4) {
        K.sperre = K.jetzt() + 1500;
        K.spaeter(() => {
          if (!K.laeuft) return;
          v.chung.aktion(P.KOERPER, 620, false, K.nah ? 6 : 32);
          K.spaeter(() => {
            if (!K.laeuft) return;
            v.hong.aktion(P.TREFFER, 520); v.anzeige("+2", "#7FB2FF", false, false);
            meldung("Konter von Chung! Drehtritte bringen viele Punkte, sind aber riskant.");
            punkte(1, 2, 1);
          }, 220);
        }, 380);
      } else {
        meldung(tc.kopf && K.hoch ? "Die Deckung war oben – Kopftritte werden leicht geblockt." : "Nicht getroffen – achte auf Abstand und Deckung.");
      }
    }
  }, 230);
}
function chungGreiftAn() {
  const r = zz(100);
  K.angriff = r < 25 ? TECH[0] : r < 75 ? TECH[1] : TECH[2];
  K.modus = 2; K.abwehrEnde = K.jetzt() + 1700;
  steuerung(); tipp();
}
function abwehr(code, grund) {
  const v = K.bild, a = K.angriff;
  if (!a || K.modus !== 2) return;
  K.modus = 1; K.angriff = null; K.sperre = K.jetzt() + 1000; K.angriffAb = K.jetzt() + 4000 + zz(3500);
  steuerung();
  v.chung.aktion(a.pose, 650, false, vorschubFuer(a));
  const getroffen = text => K.spaeter(() => {
    if (!K.laeuft) return;
    v.hong.aktion(P.TREFFER, 520); v.anzeige("+" + a.p, "#7FB2FF", false, a.kopf);
    meldung(`${text} Chung trifft mit ${a.name} = ${a.p} ${punktWort(a.p)}.`);
    punkte(1, a.p, a.art);
  }, 230);
  if (code === 0) { if (zz(100) < 85) { v.hong.aktion(P.BLOCK, 600); v.anzeige("Makki!", "#fff", false, a.kopf, false); meldung("Gut geblockt! Makki = Abwehr."); } else getroffen("Block zu spät."); }
  else if (code === 1) { if (zz(100) < 70) { v.hong.aktion(P.AUSWEICHEN, 650); meldung("Ausgewichen – aber bleib innerhalb der Linie!"); } else getroffen("Nicht weit genug ausgewichen."); }
  else if (code === 2) {
    const d = TECH[4];
    v.hong.aktion(d.pose, 650, true, K.nah ? 6 : 32); sprich(d.hg);
    if (zz(100) < 50) K.spaeter(() => { if (!K.laeuft) return; v.chung.aktion(P.TREFFER, 520); v.anzeige("+4", "#FFD54A", true, false); meldung("Konter! Dwi-chagi in den Angriff = 4 Punkte."); punkte(0, 4, 3); }, 260);
    else getroffen("Konter zu spät.");
  } else if (code === 3) gamJeom(0, grund);
  else getroffen("Zu langsam reagiert.");
}
function zeitUm() {
  const [h, c] = K.punkte;
  if (h > c) return rundeEnde(0, `mehr Punkte (${h} : ${c})`);
  if (c > h) return rundeEnde(1, `mehr Punkte (${c} : ${h})`);
  const namen = ["Drehtritte", "Kopftritte", "Körpertritte", "Fauststöße"], folge = [3, 2, 1, 0];
  for (let i = 0; i < 4; i++) { const a = folge[i]; if (K.art[0][a] !== K.art[1][a]) return rundeEnde(K.art[0][a] > K.art[1][a] ? 0 : 1, "Gleichstand – Überlegenheit durch mehr Punkte aus " + namen[i]); }
  if (K.gj[0] !== K.gj[1]) return rundeEnde(K.gj[0] < K.gj[1] ? 0 : 1, "Gleichstand – weniger Gam-jeom");
  rundeEnde(zz(2), "Gleichstand – Entscheidung der Kampfrichter");
}
function rundeEnde(sieger, grund) {
  if (K.modus !== 1 && K.modus !== 2) return;
  K.laeuft = false; K.stopp();
  K.siege[sieger]++;
  K.bild.ansage("KEU-MAN"); sprich("그만");
  K.ergebnis = `${K.runde}. Runde: ${sieger === 0 ? "Hong (du)" : "Chung"} gewinnt\n${grund}`;
  K.meldung = "";
  if (K.siege[sieger] >= 2) {
    K.modus = 4;
    K.spaeter(() => { K.bild && K.bild.ansage(sieger === 0 ? "HONG SEUNG!" : "CHUNG SEUNG!"); sprich(sieger === 0 ? "홍 승" : "청 승"); }, 1400);
  } else K.modus = 3;
  kampfAnzeige(); steuerung(); tipp();
}
function kampfAnzeige() {
  const z = document.getElementById("kZeit"); if (!z) return;
  const s = Math.ceil(K.zehntel / 10);
  z.textContent = Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
  document.getElementById("kRunde").textContent = "Runde " + K.runde;
  for (let i = 0; i < 2; i++) {
    document.getElementById("kP" + i).textContent = K.punkte[i];
    document.getElementById("kI" + i).textContent = "GJ " + K.gj[i] + " · " + "●".repeat(K.siege[i]) + "○".repeat(Math.max(0, 2 - K.siege[i]));
  }
}
function steuerung() {
  const el = document.getElementById("kSteuer"); if (!el) return;
  if (K.modus === 1) {
    el.innerHTML = `<div class="k-gitter">${TECH.map((tc, i) => `<button class="k-btn ${tc.dreh ? "dreh" : ""}" data-t="${i}">${esc(tc.name)}<small>${tc.p} ${punktWort(tc.p)} · ${tc.kopf ? "Kopf" : "Körper"}${tc.dreh ? " · gedreht" : ""}</small></button>`).join("")}</div>`;
    klick(el, "[data-t]", b => angriff(TECH[+b.dataset.t]));
  } else if (K.modus === 2) {
    const verboten = [["Festhalten", "Festhalten oder Klammern ist verboten"], ["Wegschieben", "Schieben ist verboten"], ["Hinter die Linie flüchten", "Über die Begrenzungslinie treten ist verboten"], ["Tritt unter die Gürtellinie", "Tritte unter die Gürtellinie sind verboten"]][zz(4)];
    const opts = mischen([["Makki – blocken", 0, ""], ["Ausweichen – Schritt zurück", 1, ""], ["Konter: Dwi-chagi (4)", 2, ""], [verboten[0], 3, verboten[1]]]);
    el.innerHTML = `<div class="t-gross" style="text-align:center;text-transform:uppercase;letter-spacing:.04em">Chung greift an!</div><div class="abwehr-zeit" id="abwehrZeit" style="width:100%"></div>
      <div class="k-gitter">${opts.map((o, i) => `<button class="k-btn" style="min-height:56px" data-a="${i}">${esc(o[0])}</button>`).join("")}</div>`;
    klick(el, "[data-a]", b => { const o = opts[+b.dataset.a]; abwehr(o[1], o[2]); });
  } else if (K.modus === 3 || K.modus === 4) {
    const du = K.siege[0] >= 2;
    el.innerHTML = `<div class="k-karte"><b style="white-space:pre-line;font-size:16px">${esc(K.ergebnis)}</b>
      ${K.modus === 4 ? `<span class="t-gross" style="font-size:22px;color:${du ? "var(--gold)" : "#7FB2FF"}">${du ? "Du gewinnst – Hong seung!" : "Chung gewinnt – Chung seung!"}</span><span class="klein" style="color:var(--hellgrau)">Runden: ${K.siege[0]} : ${K.siege[1]}</span>`
        : `<span class="klein" style="color:var(--hellgrau)">Stand nach Runden: ${K.siege[0]} : ${K.siege[1]} · Wer zuerst 2 Runden gewinnt, gewinnt den Kampf.</span>`}</div>
      <button class="haupt-btn" id="weiter">${K.modus === 3 ? "Nächste Runde" : "Neuer Kampf"}</button>`;
    el.querySelector("#weiter").onclick = () => { if (K.modus === 3) K.runde++; else K.neu(); starteRunde(); };
  } else if (K.modus === 5) {
    el.innerHTML = `<div class="k-karte"><span style="font-size:15px;line-height:1.45">Du kämpfst als HONG (rot) gegen CHUNG (blau). Tippe die passende Technik – achte auf Abstand und Deckung. Greift Chung an, musst du schnell reagieren.</span><span class="klein" style="color:var(--hellgrau)">3 Runden à ${SEK} Sekunden · wer 2 Runden gewinnt, gewinnt den Kampf.</span></div>
      <button class="haupt-btn" id="los">Kampf beginnen</button><button class="text-link" id="regeln" style="color:#fff;text-align:center">Punkte &amp; Regeln ansehen ›</button>`;
    el.querySelector("#los").onclick = starteRunde;
    el.querySelector("#regeln").onclick = () => zeige("regeln");
  } else {
    el.innerHTML = `<div class="klein" style="text-align:center;padding:24px 0;color:var(--hellgrau);font-weight:700">Bereit machen …</div>`;
  }
}
SEITEN.kampf = () => {
  const tafel = i => `<div class="seite-p ${i ? "chung" : "hong"}"><div class="nm">${i ? "CHUNG" : "HONG · DU"}</div><div class="pk" id="kP${i}">0</div><div class="inf" id="kI${i}"></div></div>`;
  setze(`<div class="seite dunkle-seite" style="height:100vh;height:100dvh;min-height:560px">
    ${kopf("Kyorugi", null, '<button class="rund-btn" id="regelnBtn" aria-label="Punkte und Regeln">?</button>', false)}
    <div class="tafel">${tafel(0)}<div class="mitte"><div class="zeit" id="kZeit">1:00</div><div class="klein" id="kRunde">Runde 1</div></div>${tafel(1)}</div>
    <div id="kampfflaeche"></div><div class="k-tipp" id="kTipp"></div><div class="k-steuer" id="kSteuer"></div></div>`, r => {
    r.querySelector("#regelnBtn").onclick = () => zeige("regeln");
  });
  K.bild = new KampfBild(document.getElementById("kampfflaeche"));
  K.bild.setzeAbstand(K.nah); K.bild.setzeDeckung(K.hoch);
  aufraeumen.push(() => { K.stopp(); if (K.bild) K.bild.stopp(); K.bild = null; });
  kampfAnzeige(); steuerung(); tipp();
  if (K.laeuft) K.takt = setInterval(kampfTakt, 100);
  else if (K.modus === 0) starteRunde();
};
SEITEN.regeln = () => {
  const kmd = [["B008", "Joon-bi", "Bereitmachen"], ["B009", "Shi-jak", "Beginn"], ["E13", "Gallyeo", "Trennen / Unterbrechen"], ["E14", "Gyesok", "Weiterkämpfen"], ["B010", "Geu-man", "Ende der Runde"], ["B041", "Gam-jeom", "Strafpunkt"], ["E11", "Seung", "Sieg – z. B. „Hong seung“"]];
  setze(`<div class="seite">${kopf("Punkte & Regeln", "Olympischer Zweikampf (Kyorugi)")}<main class="inhalt">
    <div class="label">Punkte</div>${TECH.map(tc => eintrag(tc.name, tc.hg, tc.aus, `${tc.de} · ${tc.p} ${punktWort(tc.p)}`)).join("")}
    <div class="karte"><span class="label">Gam-jeom (Strafpunkt)</span><span style="font-size:15px">Jeder Gam-jeom gibt dem Gegner 1 Punkt. Beispiele:</span>
      <ul class="liste"><li>über die Begrenzungslinie treten</li><li>Festhalten, Klammern, Schieben</li><li>Tritte unter die Gürtellinie</li><li>Schlag mit der Hand zum Kopf</li><li>Kampf vermeiden oder verzögern</li><li>Angriff auf einen Gegner, der am Boden liegt</li></ul></div>
    <div class="karte"><span class="label">Kampfablauf</span><ul class="liste">
      <li>3 Runden à 2 Minuten, 1 Minute Pause (im Spiel: ${SEK} Sekunden).</li>
      <li>Jede Runde wird einzeln gewertet – wer zuerst 2 Runden gewinnt, gewinnt den Kampf.</li>
      <li>12 Punkte Vorsprung beenden die Runde sofort.</li>
      <li>5 Gam-jeom in einer Runde: Runde verloren.</li>
      <li>Gleichstand: Überlegenheit entscheidet – zuerst zählen Punkte aus Drehtritten, dann Kopf-, Körpertritte und Fauststöße.</li></ul></div>
    <div class="label" style="margin-top:6px">Kommandos des Kampfrichters</div>
    ${kmd.map(([id, ko, de]) => { const w = D.begriffe.find(x => x.id === id); return eintrag(w ? w.koreanisch : ko, w ? w.hangul : "", w ? w.aussprache : ko, de); }).join("")}
    <p class="mini">Vereinfacht nach den Wettkampfregeln von World Taekwondo (olympisches Taekwondo). Im echten Kampf zählen elektronische Westen und Kopfschutz (PSS) die Treffer. Regeln ändern sich gelegentlich – im Zweifel gilt, was Trainer und Kampfrichter sagen.</p>
  </main></div>`);
};

// Start
verlauf.push(["start"]);
malen();
</script>
